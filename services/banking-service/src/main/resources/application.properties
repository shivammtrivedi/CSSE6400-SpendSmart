spring.application.name=banking-service
server.port=8083

obp.api.base-url=https://apisandbox.openbankproject.com
obp.api.version=v5.1.0

# bank-auth-service — resolves OBP OAuth tokens
bank-auth.service.url=${BANK_AUTH_SERVICE_URL:http://bank-auth-service:8087}

# BankApiNodeJs — transaction data source
bankapi.base-url=${BANK_API_BASE_URL:http://localhost:3000}

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${COGNITO_JWKS_URI:https://cognito-idp.ap-southeast-2.amazonaws.com/PLACEHOLDER/.well-known/jwks.json}

spring.application.name=bank-auth-service
server.port=8087

# OBP OAuth credentials (set via environment variables in production)
obp.api.base-url=https://apisandbox.openbankproject.com
obp.api.version=v5.1.0

# BankApiNodeJs credentials (set via environment variables in production)
bank-api.base-url=${BANK_API_BASE_URL:http://localhost:3000}

# DynamoDB (token store) — configure via environment variables in production
aws.dynamodb.table-name=bank-auth-tokens
aws.region=ap-southeast-2

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${COGNITO_JWKS_URI:https://cognito-idp.ap-southeast-2.amazonaws.com/PLACEHOLDER/.well-known/jwks.json}

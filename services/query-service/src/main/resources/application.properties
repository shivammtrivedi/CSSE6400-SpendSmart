spring.application.name=query-service
server.port=8084

# banking-service — source of transaction data
banking.service.url=${BANKING_SERVICE_URL:http://localhost:8083}

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${COGNITO_JWKS_URI:https://cognito-idp.ap-southeast-2.amazonaws.com/PLACEHOLDER/.well-known/jwks.json}

# PostgreSQL — shared spendsmart database (new persisted-transactions table)
spring.datasource.url=${QUERY_DB_URL:jdbc:postgresql://localhost:5432/spendsmart}
spring.datasource.username=${QUERY_DB_USER:spendsmart}
spring.datasource.password=${QUERY_DB_PASS:spendsmart}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

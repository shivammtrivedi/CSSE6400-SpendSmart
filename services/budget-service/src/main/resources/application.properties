spring.application.name=budget-service
server.port=8089

spring.datasource.url=jdbc:postgresql://localhost:5432/spendsmart
spring.datasource.username=spendsmart
spring.datasource.password=spendsmart
spring.datasource.hikari.pool-name=${DB_POOL_NAME:budget-service-hikari}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:4}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:10000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:300000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.leak-detection-threshold=${DB_POOL_LEAK_DETECTION_MS:20000}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=false

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${COGNITO_JWKS_URI:https://cognito-idp.ap-southeast-2.amazonaws.com/PLACEHOLDER/.well-known/jwks.json}
logging.level.com.zaxxer.hikari=INFO
logging.level.com.zaxxer.hikari.pool.ProxyLeakTask=WARN

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

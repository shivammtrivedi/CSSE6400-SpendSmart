services:

  # Shared database — all services use separate tables within this single instance
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: spendsmart
      POSTGRES_USER: spendsmart
      POSTGRES_PASSWORD: spendsmart
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # SonarQube (code quality) — start with: docker-compose --profile sonarqube up
  # First-time setup: visit http://localhost:9000 (admin/admin), change password, then
  # generate a token at My Account > Security to use with ./gradlew sonarqube -Dsonar.token=<your-token>

  postgres-sonar:
    profiles: ["sonarqube"]
    image: postgres:16
    environment:
      POSTGRES_DB: sonar_db
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
    ports:
      - "5433:5432"
    volumes:
      - postgres-sonar-data:/var/lib/postgresql/data

  sonarqube:
    profiles: ["sonarqube"]
    image: sonarqube:lts-community
    depends_on:
      - postgres-sonar
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://postgres-sonar:5432/sonar_db
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    ports:
      - "9000:9000"
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-logs:/opt/sonarqube/logs
      - sonarqube-extensions:/opt/sonarqube/extensions

volumes:
  postgres-data:
  postgres-sonar-data:
  sonarqube-data:
  sonarqube-logs:
  sonarqube-extensions:

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  # ── Step 1: figure out which services actually changed ──────────────────────
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            expense-service:
              - 'services/expense-service/**'
            group-service:
              - 'services/group-service/**'
            banking-service:
              - 'services/banking-service/**'
            bank-auth-service:
              - 'services/bank-auth-service/**'
            query-service:
              - 'services/query-service/**'
            alerts-service:
              - 'services/alerts-service/**'
            gateway:
              - 'services/gateway/**'

  # ── Step 2: build + test only the changed services (in parallel) ────────────
  build-and-test:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.services != '[]' }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false   # one service failing won't cancel the others
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Caches ~/.gradle/caches and ~/.gradle/wrapper across runs
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build — ${{ matrix.service }}
        working-directory: services/${{ matrix.service }}
        run: ./gradlew build -x test

      - name: Test — ${{ matrix.service }}
        working-directory: services/${{ matrix.service }}
        run: ./gradlew test
        # Docker is available on ubuntu-latest, so Testcontainers works out of the box

      # Only upload reports when tests fail — keeps artifact storage clean
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.service }}
          path: services/${{ matrix.service }}/build/reports/tests/test/
          retention-days: 7
